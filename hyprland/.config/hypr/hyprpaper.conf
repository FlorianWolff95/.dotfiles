# hyprpaper 0.8.x replaced the old flat `preload = ...` / `wallpaper = ,...`
# syntax with sections. `preload` no longer exists as a key at all, and the old
# form was silently ignored -- hyprpaper started fine but logged
# "Monitor eDP-1 has no target: no wp will be created" and drew nothing.
# An empty `monitor` applies the wallpaper to every output.
wallpaper {
    monitor =
    path = /home/florian/.config/backgrounds/boats_lake.jpg
    fit_mode = cover
}
